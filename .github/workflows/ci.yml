name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Gera PDF de exemplo (área de teste, concorrência de farmácias)
        run: |
          python - <<'PY'
          from app.report import build_pdf
          from app.ponto import circulo, bairro_do_ponto
          lon, lat = -60.0217, -3.1304
          emp = {"lon": lon, "lat": lat, "raio_m": 1000, "nome": "Empreendimento de exemplo", "bairro": bairro_do_ponto(lon, lat)}
          open("amostra_estudo_localizacao.pdf", "wb").write(build_pdf(circulo(lon, lat, 1000), categoria="farmacia", empreendimento=emp))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-de-exemplo
          path: amostra_estudo_localizacao.pdf
